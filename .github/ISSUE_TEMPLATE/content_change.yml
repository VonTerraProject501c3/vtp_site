name: Content change
description: Copy, wording, a document link, a team bio, or a published fact needs to change.
labels: ["type:content"]
body:
  - type: markdown
    attributes:
      value: |
        **The site renders facts, it does not decide them.** Organizational facts — mission,
        values, leadership names and titles, EIN, legal status, compliance dates — originate in
        `vtp_governance` (`governance/canonical-facts.json`) and flow outward to this site.

        If this request changes a *fact*, it likely needs to change in governance first, or the
        next sync will overwrite it. Flag it below and we'll route it.

  - type: input
    id: page
    attributes:
      label: Page
      placeholder: about.html
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current text
      description: Quote it exactly as it appears today.
      render: text
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed text
      render: text
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it should change
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is this?
      options:
        - Wording / clarity / tone only — no facts change
        - A fact changes (name, title, date, figure, status, policy)
        - Not sure
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source of record (if a fact changes)
      description: Which governance document, board decision, or filing establishes the new value?
      placeholder: e.g. board minutes 2026-03-12; canonical-facts.json; IRS determination letter
